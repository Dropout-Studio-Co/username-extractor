name: ci

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        name: secrets, audit and lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            GITLEAKS_VERSION: 8.30.1
            GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Find the commits to check
              id: range
              env:
                  EVENT: ${{ github.event_name }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  range=""
                  if [ "$EVENT" = pull_request ]; then
                    range="$PR_BASE..HEAD"
                  elif [ "$EVENT" = push ]; then
                    if [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -Eqx '0+' \
                      && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null \
                      && git merge-base --is-ancestor "$PUSH_BEFORE" HEAD; then
                      range="$PUSH_BEFORE..HEAD"
                    fi
                  fi
                  echo "range=$range" >> "$GITHUB_OUTPUT"
                  echo "Range: ${range:-everything}"

            - name: Scan new commits for secrets
              env:
                  RANGE: ${{ steps.range.outputs.range }}
              run: |
                  curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
                    "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
                  if [ -n "$RANGE" ]; then
                    echo "Scanning $RANGE"
                    "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$RANGE" .
                  else
                    echo "No known previous commit; scanning all history"
                    "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 .
                  fi
                  echo "gitleaks ${GITLEAKS_VERSION}: ${RANGE:-all history} clean" >> "$GITHUB_STEP_SUMMARY"

            - uses: ./.github/actions/setup

            - name: Dependency audit (critical blocks, highs visible)
              # Blocking gate: any critical advisory fails the job. Highs stay visible in the
              # log and step summary but do not gate — the remaining ones are transitive with
              # no in-range fix (sharp 0.34.5 via @sveltejs/enhanced-img and vite-plugin
              # devDependency chains), so gating on them would only block unrelated work.
              id: audit
              run: |
                  set -euo pipefail
                  bun audit --audit-level=critical

                  set +e
                  bun audit --audit-level=high > "$RUNNER_TEMP/audit-high.txt" 2>&1
                  high_status=$?
                  set -e
                  {
                    echo "### Dependency audit"
                    echo ""
                    echo "- critical: gate passed (0 critical advisories)"
                    if [ "$high_status" -eq 0 ]; then
                      echo "- high: none"
                    else
                      echo "- high: present, non-blocking (no in-range fix) — see log"
                      echo ""
                      echo '```'
                      grep -E '^[[:space:]]*(high|moderate|critical):|[0-9]+ vulnerabilities' "$RUNNER_TEMP/audit-high.txt" | head -n 20
                      echo '```'
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Restore lint caches
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: node_modules/.cache/lint
                  key: lint-${{ runner.os }}-${{ hashFiles('bun.lock', '.prettierrc', '.prettierignore', 'eslint.config.js') }}
                  restore-keys: lint-${{ runner.os }}-${{ hashFiles('bun.lock', '.prettierrc', '.prettierignore', 'eslint.config.js') }}-

            - name: Lint
              run: |
                  mkdir -p node_modules/.cache/lint
                  bunx prettier --check --cache --cache-strategy content --cache-location node_modules/.cache/lint/prettier .
                  bunx eslint --cache --cache-strategy content --cache-location node_modules/.cache/lint/eslint .
                  echo "prettier + eslint: clean" >> "$GITHUB_STEP_SUMMARY"

            - name: Record runner resources
              if: always()
              run: |
                  { echo '```'; echo "runner=$RUNNER_NAME"; echo "nproc=$(nproc)"; free -m; df -h /; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    typecheck:
        name: types and tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup

            - name: Generate Worker types
              run: bun run cf-typegen

            - name: Typecheck
              run: bun run check

            - name: Unit tests
              run: bun run test

            - name: Design-system contract tests
              run: bun run test:ds

            - name: Record results
              if: always()
              run: |
                  {
                    echo "### types and tests"
                    echo ""
                    echo "- job status: ${{ job.status }}"
                    echo "- svelte-check and vitest output is in the steps above"
                  } >> "$GITHUB_STEP_SUMMARY"

    build:
        name: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/setup

            - name: Generate Worker types
              run: bun run cf-typegen

            - name: Build
              run: bun run build

            - name: Verify the composite Worker entry
              run: |
                  test -f .svelte-kit/cloudflare/_worker.js
                  test -f .svelte-kit/cloudflare/_sveltekit-worker.js
                  grep -q "queueConsumer" .svelte-kit/cloudflare/_worker.js
                  grep -q "JobCoordinator" .svelte-kit/cloudflare/_worker.js
                  du -sh .svelte-kit/cloudflare >> "$GITHUB_STEP_SUMMARY"
                  echo "composite _worker.js: queue + scheduled + JobCoordinator present" >> "$GITHUB_STEP_SUMMARY"
