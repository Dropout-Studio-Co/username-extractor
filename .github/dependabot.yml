version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          github-actions:
              patterns: ["*"]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          npm-minor-patch:
              patterns: ["*"]
              update-types: ["minor", "patch"]
          npm-major:
              patterns: ["*"]
              update-types: ["major"]
