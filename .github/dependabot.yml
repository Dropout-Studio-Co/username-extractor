version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          github-actions:
              patterns: ["*"]
      # Majors are deliberate migrations, so they are ignored here rather than
      # proposed weekly. `ignore` filters version updates only; Dependabot
      # security updates are unaffected and still open on their own.
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          npm-minor-patch:
              patterns: ["*"]
              update-types: ["minor", "patch"]
          npm-major:
              patterns: ["*"]
              update-types: ["major"]
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
